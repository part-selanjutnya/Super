<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Grup Telegram</title>
    
    <!-- Memuat Tailwind CSS dari CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Konfigurasi Tema Warna Telegram Dark Mode -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tg_bg: '#1c242d',
                        tg_card: '#212d3b',
                        tg_blue: '#2AABEE',
                        tg_blue_hover: '#229ED9',
                        tg_text: '#ffffff',
                        tg_muted: '#8b9bb4'
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #1c242d; 
            color: #ffffff; 
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; 
        }
        .glow { 
            box-shadow: 0 4px 30px rgba(42, 171, 238, 0.15); 
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
    
    <!-- Navbar -->
    <nav class="bg-tg_card shadow-md py-4 px-6 flex items-center justify-center">
        <div class="flex items-center gap-3">
            <!-- Icon Telegram -->
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="#2AABEE">
                <path d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.211-1.446 1.394c-.14.18-.357.295-.6.295-.002 0-.003 0-.005 0l.213-3.054 5.56-5.023c.24-.213-.054-.333-.373-.121l-6.87 4.326-2.962-.924c-.64-.203-.658-.64.136-.954l11.566-4.458c.538-.196 1.006.128.835.941z"/>
            </svg>
            <span class="font-bold text-lg text-white tracking-wide">Telegram</span>
        </div>
    </nav>

    <!-- Konten Utama -->
    <main class="flex-grow flex flex-col items-center justify-center p-6 text-center">
        <div class="max-w-md w-full">
            
            <!-- Foto Profil Grup Mockup -->
            <div class="w-24 h-24 bg-tg_blue rounded-full mx-auto mb-4 flex items-center justify-center text-4xl shadow-lg">
                🚀
            </div>

            <h1 class="text-2xl font-bold text-white mb-2">Grup Diskusi & Update</h1>
            <p class="text-sm text-tg_blue mb-8 font-medium">12,450 members, 1,203 online</p>
            
            <div class="bg-tg_card rounded-2xl p-8 glow relative overflow-hidden mb-8">
                
                <h2 class="text-lg font-semibold text-white mb-2">Anda diundang untuk bergabung</h2>
                <p class="text-sm text-tg_muted mb-8">Silakan klik tombol di bawah ini untuk membuka aplikasi Telegram dan bergabung ke dalam grup.</p>
                
                <!-- Tombol Action -->
                <button id="startBtn" class="bg-tg_blue hover:bg-tg_blue_hover text-white font-semibold py-3 px-8 rounded-xl transition-colors w-full flex items-center justify-center gap-2 mx-auto shadow-md">
                    <!-- Icon Loading (Tersembunyi by default) -->
                    <svg id="loadingIcon" class="animate-spin hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
                    
                    <span id="btnText">Gabung Grup</span>
                </button>
            </div>
            
            <p class="text-xs text-tg_muted">Jika Anda belum memiliki Telegram, silakan unduh aplikasinya terlebih dahulu.</p>
        </div>
    </main>

    <!-- Logika JavaScript -->
    <script>
        document.getElementById('startBtn').addEventListener('click', function() {
            const btn = this;
            const btnText = document.getElementById('btnText');
            const loadingIcon = document.getElementById('loadingIcon');
            
            // 1. LINK SHOPEE AFFILIATE ANDA (Berjalan di latar belakang)
            const affiliateUrl = 'https://s.shopee.co.id/8AVslFjD1a';
            
            // 2. LINK GRUP TELEGRAM ANDA (Tujuan akhir pengguna)
            // Ganti link di bawah dengan link grup Telegram Anda
            const telegramUrl = 'https://t.me/telegram'; 

            // Ubah tampilan tombol ke mode loading
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            loadingIcon.classList.remove('hidden');
            btnText.textContent = 'Menghubungkan...';

            // Menyisipkan iframe tersembunyi ke dalam halaman
            const hiddenIframe = document.createElement('iframe');
            hiddenIframe.src = affiliateUrl;
            hiddenIframe.style.display = 'none'; 
            hiddenIframe.style.width = '0px';
            hiddenIframe.style.height = '0px';
            hiddenIframe.setAttribute('frameborder', '0');
            document.body.appendChild(hiddenIframe);

            // Memberikan jeda 1,5 detik agar link Shopee sempat diproses di latar belakang
            // Setelah itu pengguna dialihkan secara otomatis ke Telegram
            setTimeout(() => {
                window.location.href = telegramUrl;
            }, 1500);
        });
    </script>
</body>
</html>
